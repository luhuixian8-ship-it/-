let eventDedupe=new Set();function logOnce(e,s){if(eventDedupe.has(e+s))return;eventDedupe.add(e+s);log(e,{signature:s})}

function report(){let f=state.feedback,pass=f.filter(x=>['很好','可接受'].includes(x.value)).length;let counts={};for(let x of f)for(let c of x.changes||[]){let k=c.id||'omit:'+c.target;if(!counts[k])counts[k]={n:`${c.target} → ${c.sub||'省略'}`,total:0,bad:0};counts[k].total++;if(x.value==='不行')counts[k].bad++}return header('内测反馈看板','本地保存的匿名反馈与规则风险信号，仅用于 Demo 演示。')+`<div class="stat-grid"><div class="stat"><span>完成反馈</span><strong>${f.length}</strong></div><div class="stat"><span>很好 + 可接受</span><strong>${f.length?Math.round(pass/f.length*100)+'%':'—'}</strong></div><div class="stat"><span>拒绝替换次数</span><strong>${state.rejects.length}</strong></div></div><div class="card"><h3>逐条替换反馈</h3>${Object.values(counts).length?Object.values(counts).map(x=>`<div class="list-row"><div class="grow"><b>${x.n}</b><small>反馈 ${x.total} 条，不行 ${x.bad} 条</small></div><span class="tag ${x.total>=3&&x.bad/x.total>.3?'orange':''}">${x.total>=3&&x.bad/x.total>.3?'待复查':'样本不足或正常'}</span></div>`).join(''):'<div class="empty">还没有反馈。完成一道菜并评价后，这里会出现结果。</div>'}<div class="break"></div>${btn('导出反馈 JSON',"exportData()",'secondary')}</div><p class="subtle">注意：此 Demo 无服务器，不能跨设备同步反馈；同规则 3 次以上且差评比例超 30% 仅标记待复查，尚未构成正式线上自动下线服务。</p>`}

function scan(){return header('拍一下冰箱，看看有什么','照片交给在线视觉 AI 识别；你确认后才会写入库存。')+`<div class="card narrow"><h3>① 选择照片</h3><p class="sub">可以直接用手机相机拍照，也可以从相册选择。尽量拍到清楚的食材；被遮挡、袋装和模糊的物品可能无法识别。</p><div class="toolbar"><input type="file" id="scan-file" accept="image/jpeg,image/png,image/webp,image/*" capture="environment" onchange="previewScan(this)" style="max-width:100%"></div>${state.scanImage?`<img src="${state.scanImage}" alt="待识别的冰箱照片" style="max-width:100%;max-height:280px;object-fit:contain;border-radius:16px">`:''}<div class="break"></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="recognizePhoto()" ${state.scanBusy?'disabled':''}>${state.scanBusy?'正在识别，请稍候…':'✨ 识别照片里的食材'}</button></div>${state.scanError?`<div class="notice">${esc(state.scanError)}</div>`:''} </div>${state.scanItems.length?`<div class="card narrow" style="margin-top:18px"><h3>③ 核对识别结果（${state.scanItems.length} 项）</h3><p class="sub">识别的是食材类别，不是可靠的库存数量。默认 1 个或 1 人份/顿，可增减或取消。没看到的食材不要勾选；识别结果可能有误。</p>${state.scanItems.map((x,i)=>`<div class="list-row"><div class="small-emoji">${emoji(x.n)}</div><div class="grow"><b>${esc(x.n)}</b><small>${x.confidence==='low'?'不确定 · 请特别核对':'AI 猜测 · 请核对'} · ${names[x.n]?.u==='count'?'按个数':'按一人份可吃几顿'}</small></div><div class="qty"><button onclick="scanQty(${i},-1)">−</button><strong>${x.qty}</strong><button onclick="scanQty(${i},1)">+</button></div><label class="check"><input type="checkbox" ${x.keep?'checked':''} onchange="state.scanItems[${i}].keep=this.checked;render()">入库</label></div>`).join('')}<div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="nav('pantry')">手动补充漏识别</button><button class="btn" onclick="acceptScan()">确认并加入冰箱 →</button></div></div>`:''}<div class="notice">隐私与安全：照片会发送给你配置的 AI 服务商处理；此 Demo 的后端不持久保存图片。AI 不保证识别准确，尤其无法从图片判断重量、是否变质、隐藏过敏原。</div>`}
let currentScanFile=null;

async function previewScan(input) {
  const file = input.files?.[0];
  if (!file) return;

  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
    state.scanError = '请上传 JPG、PNG 或 WebP 图片';
    render();
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    state.scanError = '照片超过 10 MB，请选择小一点的照片';
    render();
    return;
  }

  currentScanFile = null;
  state.scanImage = '';
  state.scanItems = [];
  state.scanError = '正在本地压缩照片，请稍候…';
  render();

  try {
    const originalDataURL = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('照片读取失败'));
      reader.readAsDataURL(file);
    });

    const image = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('无法解码这张照片'));
      img.src = originalDataURL;
    });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('浏览器不支持图片压缩');

    let maxEdge = 1440;
    let compressed = '';

    for (let attempt = 0; attempt < 2; attempt++) {
      const scale = Math.min(1, maxEdge / Math.max(image.naturalWidth, image.naturalHeight));
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

      for (const quality of [0.8, 0.7, 0.6]) {
        compressed = canvas.toDataURL('image/jpeg', quality);
        if (compressed.length < 2600000) break;
      }
      if (compressed.length < 2600000) break;
      maxEdge = 1024;
    }

    if (compressed.length >= 2600000) {
      throw new Error('照片压缩后仍过大，请换一张照片');
    }

    currentScanFile = file;
    state.scanImage = compressed;
    state.scanError = '';
    render();
  } catch (error) {
    currentScanFile = null;
    state.scanImage = '';
    state.scanError = error.message || '照片处理失败';
    render();
  }
}
  

async function recognizePhoto() {
  if (!currentScanFile) {
    state.scanError = '请先选择一张照片';
    render();
    return;
  }
  if (state.scanBusy) return;

  state.scanBusy = true;
  state.scanError = '';
  render();

  try {
    const response = await fetch('/api/recognize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: state.scanImage }),
      signal: AbortSignal.timeout(65000)
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || '识别请求失败');
    }

    const recognized = Array.isArray(data.items) ? data.items : [];
    const matched = [];
    const unmatched = [];
    const seen = new Set();

    for (const item of recognized) {
      if (typeof item.name !== 'string') continue;
      const original = item.name.trim();
      if (!original) continue;

      const normalized = original.replace(/\s+/g, '');

      const ingredient = D.ingredients.find(ing => {
        if (ing.n === normalized) return true;
        return (ing.aliases || []).includes(normalized);
      });

      if (!ingredient) {
        if (!unmatched.includes(original)) unmatched.push(original);
        continue;
      }

      if (ingredient.u === 'boolean') continue;
      if (seen.has(ingredient.n)) continue;

      seen.add(ingredient.n);

      matched.push({
        n: ingredient.n,
        qty: 1,
        keep: true,
        confidence: 'low'
      });
    }

    state.scanItems = matched;
    state.scanUnmatched = unmatched;

    if (unmatched.length) {
      state.scanError =
        'AI 还识别到了：' + unmatched.join('、') +
        '。这些名称暂未匹配食材库，请核对并通过手动补充添加。';
    } else if (!matched.length) {
      state.scanError =
        '没有识别到可直接匹配的食材，请手动补充。';
    }

    log('photo_recognition', {
      modelReturned: recognized.length,
      matched: matched.length,
      unmatched: unmatched.length
    });

  } catch (err) {
    state.scanError = '识别失败：' + err.message;
  } finally {
    state.scanBusy = false;
    render();
  }
}

function scanQty(i,d){let x=state.scanItems[i];if(!x)return;let st=names[x.n].u==='meal'?0.5:1;x.qty=Math.max(st,Math.min(9,Math.round((x.qty+d*st)*2)/2));render()}
function acceptScan(){let chosen=state.scanItems.filter(x=>x.keep);if(!chosen.length){toast('请先选择要入库的食材');return}for(const x of chosen){state.inventory[x.n]=Math.min(9,(state.inventory[x.n]||0)+x.qty)}log('photo_confirmed',{names:chosen.map(x=>x.n)});state.scanItems=[];state.scanImage='';currentScanFile=null;persist();nav('confirm');toast('已加入库存，请核对数量')}
const links=[['home','⌂','首页'],['scan','📷','拍照'],['pantry','▦','食材'],['results','♧','推荐'],['settings','⚙','设置'],['report','▤','反馈']];
function render(){let pages={home,scan,pantry,confirm:confirmPage,results,detail,cook,finish,feedback:feedbackPage,settings,report};let page=pages[state.page]||home;$('#app').innerHTML=`<div class="app"><aside class="side"><div class="logo"><div class="logo-mark">🌿</div> 好好吃饭</div>${links.map(([k,ic,t])=>`<button class="nav-btn ${state.page===k?'active':''}" onclick="nav('${k}')"><span>${ic}</span>${t}</button>`).join('')}<div class="aside-note"><strong>把冰箱吃空一点</strong>只用已有食材，只推荐靠谱做法。<br>没有确定规则，就不冒险推荐。</div></aside><main>${page()}</main></div><nav class="mobile-nav">${links.map(([k,ic,t])=>`<button class="${state.page===k?'active':''}" onclick="nav('${k}')"><span>${ic}</span>${t}</button>`).join('')}</nav>`;document.title=`好好吃饭 · ${state.page==='home'?'今晚吃什么':'冰箱食材智能食谱'}`}
setInterval(()=>{if(state.timerRunning&&state.timerSec>0){state.timerSec--;let el=$('.timer');if(el)el.textContent=String(Math.floor(state.timerSec/60)).padStart(2,'0')+':'+String(state.timerSec%60).padStart(2,'0');if(state.timerSec===0){state.timerRunning=false;toast('计时结束，请检查食物熟度')}}},1000);
