<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · 好好吃饭</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#20392e;background:#f6f8f5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .panel{background:white;width:min(100%,430px);padding:38px 32px;border:1px solid #e4ebe4;border-radius:22px;box-shadow:0 14px 45px #24442e0b}
    .mark{width:55px;height:55px;border-radius:17px;display:grid;place-items:center;background:#e9f3eb;font-size:29px;margin-bottom:20px}
    h1{font-size:26px;letter-spacing:.03em;margin:0 0 10px}.intro{color:#61776b;font-size:14px;line-height:1.7;margin:0 0 28px}
    label{font-size:14px;font-weight:650;display:block;margin-bottom:8px}.field{margin-bottom:20px}
    input{width:100%;height:46px;padding:0 14px;border:1px solid #cbd8ce;border-radius:11px;font:inherit;font-size:15px;outline:none}
    input:focus{border-color:#38684b;box-shadow:0 0 0 3px #38684b1b}
    button{width:100%;border:0;border-radius:12px;padding:14px;background:#306447;color:white;font-size:15px;font-weight:650;cursor:pointer}
    button:disabled{cursor:wait;opacity:.7}.message{margin:17px 0 0;font-size:14px;line-height:1.65;min-height:0}
    .message.error{color:#a33224}.message.success{color:#246b42}.fine{font-size:12px;color:#84948b;line-height:1.7;margin:20px 0 0}
    @media(max-width:480px){.panel{padding:28px 23px}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true">🌿</div>
    <h1>好好吃饭</h1>
    <p class="intro">登录你的个人冰箱，把今天的食材变成一顿好饭。</p>
    <form id="login-form">
      <div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" placeholder="请输入测试账号邮箱" autocomplete="username" required></div>
      <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" placeholder="请输入测试账号密码" autocomplete="current-password" required></div>
      <button id="login-button" type="submit">登录 Demo</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
    <p class="fine">Demo 阶段暂时使用已创建的测试邮箱和密码。后续将升级为邮箱验证码登录。</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // Publishable Key 可以放在前端；请勿放入 service_role、secret key 或 Resend API Key。
    const SUPABASE_URL = 'https://smavnmrchaootkrcqvmq.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_TXXkDFOTWPpbImY_MSH9IA_DYZxKY5G';
    const form = document.getElementById('login-form');
    const button = document.getElementById('login-button');
    const message = document.getElementById('message');
    function show(text,kind=''){message.textContent=text;message.className='message '+kind;}
    if (!window.supabase?.createClient) {
      show('登录组件加载失败，请检查网络后刷新重试。','error');
      button.disabled = true;
    } else {
      const client = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        button.disabled=true;button.textContent='正在登录…';show('');
        try {
          const email=document.getElementById('email').value.trim();
          const password=document.getElementById('password').value;
          const {data,error}=await client.auth.signInWithPassword({email,password});
          if(error)throw error;
          if(!data.session)throw new Error('未获取到登录会话，请重试。');
          document.getElementById('password').value='';
          window.location.replace('/dashboard');
        } catch(e) {
          show(e?.message==='Invalid login credentials'?'邮箱或密码不正确，请检查后重试。':'登录失败：'+(e?.message||'未知错误'),'error');
        } finally {
          if(!message.classList.contains('success')) {button.disabled=false;button.textContent='登录 Demo';}
        }
      });
    }
  </script>
</body>
</html>
